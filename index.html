<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amy's Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0c1220;
    --surface:   #141d2e;
    --surface2:  #192336;
    --border:    #1f2d44;
    --text:      #e8edf5;
    --muted:     #6b7f99;
    --accent:    #4f9cf9;   /* freight blue */
    --green:     #22d3a0;   /* new badge  */
    --amber:     #f59e0b;   /* banking    */
    --purple:    #a78bfa;   /* corporate  */
    --teal:      #2dd4bf;   /* remote     */
    --pill-bg:   #1a2740;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

  /* ── Header ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 16px 12px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .site-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -.5px; line-height: 1.1; }
  .site-subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }
  .meta-pill { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .meta-pill span { color: var(--accent); font-weight: 600; }

  /* ── Category tabs ── */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab-btn { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--pill-bg); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active                { background: var(--accent);  border-color: var(--accent);  color: #fff; }
  .tab-btn.active.tab-banking    { background: var(--amber);   border-color: var(--amber);   color: #000; }
  .tab-btn.active.tab-corporate  { background: var(--purple);  border-color: var(--purple);  color: #fff; }
  .tab-btn.active.tab-remote     { background: var(--teal);    border-color: var(--teal);    color: #000; }
  .tab-btn.active.tab-sources    { background: #374151;        border-color: #374151;        color: #fff; }

  /* ── Controls row (search + sort) ── */
  .controls-wrap { padding: 12px 16px 0; display: flex; gap: 8px; align-items: center; }
  .search-input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 14px; border-radius: 8px; outline: none; transition: border-color .15s; min-width: 0; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }
  .sort-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 9px 10px; border-radius: 8px; outline: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .sort-select:focus { border-color: var(--accent); }

  /* ── Company filter chips ── */
  .filter-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-btn { flex-shrink: 0; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--pill-bg); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── Stats bar ── */
  .stats-bar { display: flex; gap: 20px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .stats-bar strong { color: var(--text); }

  /* ── Job cards ── */
  .job-list { padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 10px; }
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 36px 14px 16px; text-decoration: none; display: block; transition: border-color .15s, transform .1s; position: relative; }
  .job-card:hover { transform: translateY(-1px); }
  .job-card.freight:hover   { border-color: var(--accent); }
  .job-card.banking:hover   { border-color: var(--amber);  }
  .job-card.corporate:hover { border-color: var(--purple); }
  .job-card.remote:hover    { border-color: var(--teal);   }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .job-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); line-height: 1.3; flex: 1; }
  .new-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--green); color: #052e1c; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; margin-top: 2px; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
  .badge-company  { background: rgba(79,156,249,.12); color: var(--accent); border: 1px solid rgba(79,156,249,.25); }
  .badge-company.banking   { background: rgba(245,158,11,.12); color: var(--amber);  border-color: rgba(245,158,11,.25); }
  .badge-company.corporate { background: rgba(167,139,250,.12);color: var(--purple); border-color: rgba(167,139,250,.25);}
  .badge-company.remote    { background: rgba(45,212,191,.12); color: var(--teal);   border-color: rgba(45,212,191,.2);  }
  .badge-match    { background: rgba(34,211,160,.1);  color: var(--green);  border: 1px solid rgba(34,211,160,.2); }
  .badge-platform { background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border); }
  .card-detail { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card-arrow { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; opacity: .35; }

  /* ── Section headers ── */
  .section-header { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .section-header .count-freight   { color: var(--accent);  }
  .section-header .count-banking   { color: var(--amber);   }
  .section-header .count-corporate { color: var(--purple);  }
  .section-header .count-remote    { color: var(--teal);    }

  /* ── Sources panel ── */
  .sources-panel { padding: 12px 16px 32px; }
  .sources-intro { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .sources-group-label { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .sources-grid { display: flex; flex-direction: column; gap: 6px; }
  .source-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; transition: border-color .15s; }
  .source-row.freight:hover   { border-color: var(--accent); }
  .source-row.banking:hover   { border-color: var(--amber);  }
  .source-row.corporate:hover { border-color: var(--purple); }
  .source-row.remote:hover    { border-color: var(--teal);   }
  .source-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .source-count { font-size: 11px; color: var(--muted); }
  .source-count .c-freight   { color: var(--accent);  font-weight: 600; }
  .source-count .c-banking   { color: var(--amber);   font-weight: 600; }
  .source-count .c-corporate { color: var(--purple);  font-weight: 600; }
  .source-count .c-remote    { color: var(--teal);    font-weight: 600; }

  /* ── Remote links panel ── */
  .remote-links { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .remote-link-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-decoration: none; display: flex; justify-content: space-between; align-items: center; transition: border-color .15s; }
  .remote-link-card:hover { border-color: var(--teal); }
  .remote-link-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 14px; color: var(--text); }
  .remote-link-desc  { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .remote-ext { font-size: 18px; color: var(--muted); opacity: .4; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { color: var(--text); font-family: 'Syne', sans-serif; margin-bottom: 6px; }
  .last-updated { font-size: 11px; color: var(--muted); text-align: center; padding: 0 16px 24px; }

  @media (min-width: 600px) {
    .header, .controls-wrap, .filter-scroll, .stats-bar { padding-left: 24px; padding-right: 24px; }
    .job-list, .sources-panel, .remote-links { padding: 14px 24px 40px; }
    .sources-grid { display: grid; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="site-title">Amy's Job Tracker</div>
      <div class="site-subtitle" id="source-count-label">Loading…</div>
    </div>
    <div class="meta-pill" id="total-pill">loading…</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active"              id="tab-all"       onclick="setTab('all')">All Jobs</button>
    <button class="tab-btn tab-freight"         id="tab-freight"   onclick="setTab('freight')">🚛 Freight</button>
    <button class="tab-btn tab-banking"         id="tab-banking"   onclick="setTab('banking')">🏦 Banking</button>
    <button class="tab-btn tab-corporate"       id="tab-corporate" onclick="setTab('corporate')">🏢 Corporate</button>
    <button class="tab-btn tab-remote"          id="tab-remote"    onclick="setTab('remote')">💻 Remote</button>
    <button class="tab-btn tab-sources"         id="tab-sources"   onclick="setTab('sources')">📋 Sources</button>
  </div>

  <div class="filter-scroll" id="filter-bar">
    <button class="filter-btn active" data-source="all" onclick="setSource('all')">All Companies</button>
  </div>
</div>

<div class="controls-wrap" id="controls-wrap">
  <input class="search-input" id="search" type="search" placeholder="Search jobs, companies, keywords…" autocomplete="off">
  <select class="sort-select" id="sort-select" onchange="renderAll()">
    <option value="newest">Newest First</option>
    <option value="company">Company A–Z</option>
    <option value="title">Title A–Z</option>
    <option value="category">By Category</option>
  </select>
</div>

<div class="stats-bar" id="stats-bar"><span>Loading…</span></div>
<div id="main-content">
  <div class="job-list"><div style="text-align:center;padding:60px;color:var(--muted);">Fetching jobs…</div></div>
</div>
<div class="last-updated" id="last-updated"></div>

<script>
let allJobs = [], allSources = [], activeTab = "all", activeSource = "all", searchQuery = "";
const today = new Date().toISOString().split("T")[0];

const CAT_CONFIG = {
  freight:   { label: "🚛 Freight & Logistics", color: "var(--accent)",  countClass: "count-freight"   },
  banking:   { label: "🏦 Banking",             color: "var(--amber)",   countClass: "count-banking"   },
  corporate: { label: "🏢 Corporate",            color: "var(--purple)",  countClass: "count-corporate" },
  remote:    { label: "💻 Remote",              color: "var(--teal)",    countClass: "count-remote"    },
};

// ── Data load ────────────────────────────────────────────────────────────────

async function loadJobs() {
  try {
    const r    = await fetch("jobs.json?t=" + Date.now());
    const data = await r.json();
    allJobs    = data.jobs    || [];
    allSources = data.sources || [];
    document.getElementById("source-count-label").textContent =
      `${allSources.length} sources · AR · OK · MO · KS · TX · Remote`;
    buildFilters();
    renderAll();
    document.getElementById("last-updated").textContent =
      data.last_updated
        ? "Last updated: " + new Date(data.last_updated).toLocaleString()
        : "Run the scraper to populate this dashboard.";
  } catch(e) {
    document.getElementById("main-content").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>
       <h3>Couldn't load jobs.json</h3>
       <p>Make sure index.html is inside docs/ alongside jobs.json.</p></div>`;
  }
}

// ── Filters ──────────────────────────────────────────────────────────────────

function buildFilters() {
  const bar = document.getElementById("filter-bar");
  bar.querySelectorAll("[data-source]:not([data-source='all'])").forEach(el => el.remove());

  // Only show companies relevant to active tab
  const relevant = activeTab === "all"
    ? allJobs
    : allJobs.filter(j => (j.category || "freight") === activeTab);

  const names = [...new Set(relevant.map(j => j.district))].sort();
  names.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.source = s;
    btn.textContent = s;
    btn.onclick = () => setSource(s);
    bar.appendChild(btn);
  });
}

function setTab(tab) {
  activeTab    = tab;
  activeSource = "all";
  searchQuery  = "";
  document.getElementById("search").value = "";
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  document.querySelectorAll(".filter-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.source === "all"));

  const showControls = tab !== "sources";
  document.getElementById("controls-wrap").style.display = showControls ? "" : "none";
  document.getElementById("stats-bar").style.display     = showControls ? "" : "none";
  document.getElementById("filter-bar").style.display    = showControls ? "" : "none";

  buildFilters();
  renderAll();
}

function setSource(source) {
  activeSource = source;
  document.querySelectorAll(".filter-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.source === source));
  renderAll();
}

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase(); renderAll();
});

// ── Filtering & sorting ───────────────────────────────────────────────────────

function filtered() {
  return allJobs.filter(j => {
    const cat = j.category || "freight";
    if (activeTab !== "all" && activeTab !== "sources" && cat !== activeTab) return false;
    if (activeSource !== "all" && j.district !== activeSource) return false;
    if (searchQuery && ![j.title, j.district, j.location||"", j.match_reason||""].some(s => s.toLowerCase().includes(searchQuery))) return false;
    return true;
  });
}

function sorted(jobs) {
  const sortBy = document.getElementById("sort-select").value;
  return [...jobs].sort((a, b) => {
    // Always put today's new jobs first unless user picked a different sort
    if (sortBy === "newest") {
      const aN = a.first_seen === today ? 0 : 1, bN = b.first_seen === today ? 0 : 1;
      if (aN !== bN) return aN - bN;
      return (b.first_seen || "").localeCompare(a.first_seen || "");
    }
    if (sortBy === "company") return a.district.localeCompare(b.district);
    if (sortBy === "title")   return a.title.localeCompare(b.title);
    if (sortBy === "category") {
      const order = ["freight","banking","corporate","remote"];
      const ac = order.indexOf(a.category||"freight"), bc = order.indexOf(b.category||"freight");
      if (ac !== bc) return ac - bc;
      return a.district.localeCompare(b.district);
    }
    return 0;
  });
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderAll() {
  const mc = document.getElementById("main-content");

  if (activeTab === "sources") {
    renderSources(mc); return;
  }

  const jobs    = sorted(filtered());
  const newOnes = jobs.filter(j => j.first_seen === today);
  const catCount = {};
  allJobs.forEach(j => { const c = j.category||"freight"; catCount[c] = (catCount[c]||0)+1; });

  document.getElementById("total-pill").innerHTML = `<span>${allJobs.length}</span> matches`;
  document.getElementById("stats-bar").innerHTML  =
    `<span><strong>${jobs.length}</strong> showing</span>
     <span><strong>${newOnes.length}</strong> new today</span>
     <span><strong>${allJobs.length}</strong> total</span>`;

  if (!jobs.length) {
    mc.innerHTML = `<div class="job-list"><div class="empty"><div class="empty-icon">🔍</div>
      <h3>${allJobs.length ? "No matches" : "No jobs yet"}</h3>
      <p>${allJobs.length ? "Clear your filter or search." : "Run the scraper first."}</p></div></div>`;
    return;
  }

  let html = '<div class="job-list">';

  if (activeTab === "all") {
    // Group by category
    const ORDER = ["freight","banking","corporate","remote"];
    ORDER.forEach(cat => {
      const group = jobs.filter(j => (j.category||"freight") === cat);
      if (!group.length) return;
      const cfg = CAT_CONFIG[cat];
      html += `<div class="section-header">
        <span>${cfg.label}</span>
        <span class="${cfg.countClass}">${group.length}</span>
      </div>`;
      html += group.map(cardHTML).join("");
    });
  } else {
    html += jobs.map(cardHTML).join("");
  }

  html += "</div>";
  mc.innerHTML = html;
}

function renderSources(mc) {
  document.getElementById("total-pill").innerHTML = `<span>${allSources.length}</span> sources`;
  const jobsBySource = {};
  allJobs.forEach(j => { jobsBySource[j.district] = (jobsBySource[j.district]||0) + 1; });

  const groups = {
    freight:   allSources.filter(s => s.category === "freight"),
    banking:   allSources.filter(s => s.category === "banking"),
    corporate: allSources.filter(s => s.category === "corporate"),
    remote:    allSources.filter(s => s.category === "remote"),
  };

  function sourceRow(s) {
    const count   = jobsBySource[s.name] || 0;
    const cat     = s.category;
    const countEl = count > 0
      ? `<span class="source-count"><span class="c-${cat}">${count}</span> match${count !== 1 ? "es" : ""}</span>`
      : `<span class="source-count">0 matches</span>`;
    return `<a class="source-row ${esc(cat)}" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="source-name">${esc(s.name)}</span>${countEl}</a>`;
  }

  const ORDER = [
    ["freight",   "🚛 Freight & Logistics"],
    ["banking",   "🏦 Banking"],
    ["corporate", "🏢 Corporate"],
    ["remote",    "💻 Remote Job Boards"],
  ];

  let html = `<div class="sources-panel">
    <p class="sources-intro">All sources the scraper checks daily. Click any to visit the job board directly.</p>`;

  ORDER.forEach(([cat, label]) => {
    const srcs = groups[cat] || [];
    if (!srcs.length) return;
    html += `<div class="sources-group-label">${esc(label)} (${srcs.length})</div>
             <div class="sources-grid">${srcs.map(sourceRow).join("")}</div>`;
  });

  html += "</div>";
  mc.innerHTML = html;
}

function cardHTML(j) {
  const cat    = j.category || "freight";
  const isNew  = j.first_seen === today;
  const det    = [j.location, j.posted_date ? "Posted " + j.posted_date : ""].filter(Boolean).join(" · ");
  return `
  <a class="job-card ${esc(cat)}" href="${esc(j.url)}" target="_blank" rel="noopener">
    <div class="card-top">
      <div class="job-title">${esc(j.title)}</div>
      ${isNew ? '<span class="new-badge">New</span>' : ""}
    </div>
    <div class="card-meta">
      <span class="badge badge-company ${esc(cat)}">${esc(j.district)}</span>
      ${j.match_reason && j.match_reason !== "no_match" ? `<span class="badge badge-match">${esc(j.match_reason)}</span>` : ""}
      <span class="badge badge-platform">${esc(j.platform)}</span>
    </div>
    ${det ? `<div class="card-detail">${esc(det)}</div>` : ""}
    <span class="card-arrow">›</span>
  </a>`;
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadJobs();
</script>
</body>
</html>
